<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarePoint | Hospital Management</title>
<style>
:root{--navy:#143b55;--teal:#148a91;--bg:#f3f7fb;--ink:#203344;--muted:#6b8192;--line:#dce6ed;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 "Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#143b55,#176f7c);color:white;padding:25px clamp(18px,4vw,54px)}header h1{margin:0;font-size:28px}header p{margin:4px 0 0;color:#d7eaf0}.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 100px)}aside{background:#fff;padding:20px 12px;border-right:1px solid var(--line)}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:9px;color:#405568;font-size:15px;cursor:pointer;margin:3px 0}.nav.active,.nav:hover{background:#e7f5f5;color:#08757c;font-weight:700}main{padding:26px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.topline h2{margin:0;font-size:24px}.sub{color:var(--muted);margin:3px 0 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.card,.panel{background:white;border:1px solid #e5edf2;border-radius:15px;padding:20px;box-shadow:0 5px 18px #193d5508}.metric{font-size:29px;font-weight:750;margin-top:8px}.metric-label{color:var(--muted);font-size:13px}.panel{margin-bottom:18px}.panel h3{margin:0 0 16px;font-size:18px}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:12px}.field label{display:block;font-size:12px;color:#52697b;margin-bottom:5px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #d1dee7;border-radius:8px;background:white;color:var(--ink);font:inherit;min-width:0}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:var(--teal);color:white;padding:10px 15px;cursor:pointer;font-weight:650}.btn.secondary{background:#e7eff4;color:#29485b}.btn.danger{background:#fff0ef;color:#b43d36;padding:7px 10px}.btn.small{padding:7px 10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7edf1}th{color:#607789;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tbody tr:hover{background:#f8fbfd}.empty{text-align:center;color:var(--muted);padding:28px}.message{display:none;margin-bottom:15px;padding:11px 14px;border-radius:8px}.message.show{display:block}.message.ok{background:#e6f7ee;color:#176a45}.message.err{background:#fff0ef;color:#a3322a}.hint{font-size:12px;color:var(--muted);margin-top:10px}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#edf4f7;font-size:12px}.pill.Paid,.pill.Completed{background:#e6f7ee;color:#176a45}.pill.Cancelled,.pill.Unpaid{background:#fff0ef;color:#a3322a}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.shell{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{white-space:nowrap;width:auto}main{padding:15px}.cards{gap:8px}.card{padding:14px}.metric{font-size:24px}.formgrid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>CarePoint <span style="font-weight:400">| Hospital Management</span></h1><p>One workspace for patients, doctors, appointments and billing</p></header>
<div class="shell"><aside><button class="nav active" data-page="dashboard">▦ &nbsp; Dashboard</button><button class="nav" data-page="patients">♙ &nbsp; Patients</button><button class="nav" data-page="doctors">✚ &nbsp; Doctors</button><button class="nav" data-page="appointments">▣ &nbsp; Appointments</button><button class="nav" data-page="bills">▤ &nbsp; Billing</button></aside><main><div id="message" class="message"></div><div class="topline"><div><h2 id="pageTitle">Dashboard</h2><p class="sub" id="pageSub">Overview of your hospital operations</p></div><button class="btn secondary" onclick="refresh()">↻ Refresh</button></div><div id="content"></div><p class="hint">Learning project · Local SQLite database · Do not use with real patient data without proper security, privacy controls and clinical validation.</p></main></div>
<script>
const $=s=>document.querySelector(s);let page='dashboard',cache={patients:[],doctors:[],appointments:[],bills:[]};
async function api(url,opts={}){let r=await fetch('/api'+url,{headers:{'Content-Type':'application/json'},...opts});let data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.message||data.error||'Request failed ('+r.status+')');return data}
function msg(text,err=false){let el=$('#message');el.textContent=text;el.className='message show '+(err?'err':'ok');setTimeout(()=>el.className='message',4000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,name,type='text',required=false,extra=''){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" ${required?'required':''} ${extra}></div>`}
function selectField(label,name,items,required=true){return `<div class="field"><label>${label}${required?' *':''}</label><select name="${name}" ${required?'required':''}><option value="">Choose...</option>${items.map(x=>`<option value="${esc(x.value)}">${esc(x.label)}</option>`).join('')}</select></div>`}
function formPanel(title,fields,button='Save'){return `<section class="panel"><h3>${title}</h3><form id="entryForm"><div class="formgrid">${fields.join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" type="submit">${button}</button><button class="btn secondary" type="reset">Clear</button></div></form></section>`}
function table(title,headers,rows){return `<section class="panel"><h3>${title}</h3><div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${headers.length}">No records yet</td></tr>`}</tbody></table></div></section>`}
async function loadAll(){for(let k of ['patients','doctors','appointments','bills'])try{cache[k]=await api('/'+k)}catch(e){cache[k]=[]}}
async function refresh(){try{await loadAll();await render()}catch(e){msg(e.message,true)}}
function setPage(p){page=p;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
async function render(){let titles={dashboard:['Dashboard','Overview of your hospital operations'],patients:['Patients','Register and maintain patient details'],doctors:['Doctors','Manage doctor profiles and consultation fees'],appointments:['Appointments','Schedule visits and update appointment status'],bills:['Billing','Create bills and track payment status']};$('#pageTitle').textContent=titles[page][0];$('#pageSub').textContent=titles[page][1];let c='';
if(page==='dashboard'){let d=await api('/dashboard');c=`<div class="cards">${[['Registered patients',d.patients,'♙'],['Doctors',d.doctors,'✚'],['Appointments',d.appointments,'▣'],['Unpaid bills',d.unpaidBills,'▤']].map(x=>`<div class="card"><div class="metric-label">${x[2]} &nbsp; ${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><div class="metric-label">Collected revenue</div><div class="metric">₹${Number(d.revenue).toLocaleString('en-IN',{maximumFractionDigits:2})}</div></div><div class="card"><div class="metric-label">Quick tip</div><div style="margin-top:8px">Add doctors and patients first, then create appointments and bills.</div></div></div>${table('Recent appointments',['ID','Patient','Doctor','Date','Time','Status'],cache.appointments.slice(0,5).map(a=>`<tr><td>${a.id}</td><td>${esc(a.patient_name)}</td><td>${esc(a.doctor_name)}</td><td>${esc(a.appointment_date)}</td><td>${esc(a.appointment_time)}</td><td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td></tr>`).join(''))}`}
if(page==='patients'){c=formPanel('Register patient',[field('Full name','name','text',true),field('Age','age','number',true,'min="0" max="130"'),selectField('Gender','gender',['Male','Female','Other'].map(x=>({value:x,label:x})),false),field('Phone','phone','tel'),field('Email','email','email'),field('Address','address'),field('Diagnosis','diagnosis')])+table('Patient records',['ID','Name','Age','Gender','Phone','Email','Diagnosis','Actions'],cache.patients.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.age}</td><td>${esc(p.gender)}</td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td><td>${esc(p.diagnosis)}</td><td><button class="btn small secondary" onclick="editPatient(${p.id})">Edit</button> <button class="btn danger" onclick="removeRecord('patients',${p.id})">Delete</button></td></tr>`).join(''));}
if(page==='doctors'){c=formPanel('Add doctor',[field('Full name','name','text',true),field('Specialization','specialization','text',true),field('Phone','phone','tel'),field('Email','email','email'),field('Consultation fee (₹)','consultationFee','number',false,'min="0" step="0.01"'),field('Available days','availableDays','text',false,'placeholder="Mon, Wed, Fri"')])+table('Doctor directory',['ID','Name','Specialization','Phone','Email','Fee (₹)','Available days','Actions'],cache.doctors.map(d=>`<tr><td>${d.id}</td><td>${esc(d.name)}</td><td>${esc(d.specialization)}</td><td>${esc(d.phone)}</td><td>${esc(d.email)}</td><td>${Number(d.consultation_fee||0).toFixed(2)}</td><td>${esc(d.available_days)}</td><td><button class="btn danger" onclick="removeRecord('doctors',${d.id})">Delete</button></td></tr>`).join(''));}
if(page==='appointments'){c=formPanel('Schedule appointment',[selectField('Patient','patientId',cache.patients.map(p=>({value:p.id,label:p.name+' (#'+p.id+')'}))),selectField('Doctor','doctorId',cache.doctors.map(d=>({value:d.id,label:d.name+' — '+d.specialization}))),field('Date','appointmentDate','date',true),field('Time','appointmentTime','time',true),field('Reason','reason')])+table('Appointments',['ID','Patient','Doctor','Date','Time','Reason','Status','Actions'],cache.appointments.map(a=>`<tr><td>${a.id}</td><td>${esc(a.patient_name)}</td><td>${esc(a.doctor_name)}</td><td>${esc(a.appointment_date)}</td><td>${esc(a.appointment_time)}</td><td>${esc(a.reason)}</td><td><select onchange="changeStatus(${a.id},this.value)"><option ${a.status==='Scheduled'?'selected':''}>Scheduled</option><option ${a.status==='Completed'?'selected':''}>Completed</option><option ${a.status==='Cancelled'?'selected':''}>Cancelled</option></select></td><td><button class="btn danger" onclick="removeRecord('appointments',${a.id})">Delete</button></td></tr>`).join(''));}
if(page==='bills'){c=formPanel('Create bill',[selectField('Patient','patientId',cache.patients.map(p=>({value:p.id,label:p.name+' (#'+p.id+')'}))),selectField('Appointment (optional)','appointmentId',[{value:'',label:'None'},...cache.appointments.map(a=>({value:a.id,label:'#'+a.id+' — '+a.patient_name+' / '+a.appointment_date}))],false),field('Description','description','text',true),field('Amount (₹)','amount','number',true,'min="0" step="0.01"')])+table('Bills and payments',['Bill ID','Patient','Appointment','Description','Amount (₹)','Payment status','Actions'],cache.bills.map(b=>`<tr><td>${b.id}</td><td>${esc(b.patient_name)}</td><td>${b.appointment_id??'—'}</td><td>${esc(b.description)}</td><td>${Number(b.amount).toFixed(2)}</td><td><span class="pill ${esc(b.payment_status)}">${esc(b.payment_status)}</span></td><td>${b.payment_status==='Unpaid'?`<button class="btn small" onclick="markPaid(${b.id})">Mark paid</button>`:''} <button class="btn danger" onclick="removeRecord('bills',${b.id})">Delete</button></td></tr>`).join(''));}
$('#content').innerHTML=c;let form=$('#entryForm');if(form)form.addEventListener('submit',submitForm);
}
async function submitForm(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());try{let url='/'+page;if(page==='patients')o.age=Number(o.age);if(page==='doctors')o.consultationFee=Number(o.consultationFee||0);if(page==='appointments'){o.patientId=Number(o.patientId);o.doctorId=Number(o.doctorId)}if(page==='bills'){o.patientId=Number(o.patientId);o.appointmentId=o.appointmentId?Number(o.appointmentId):null;o.amount=Number(o.amount)}await api(url,{method:'POST',body:JSON.stringify(o)});msg('Saved successfully');e.target.reset();await refresh()}catch(err){msg(err.message,true)}}
async function removeRecord(type,id){if(!confirm('Delete this record? Related records may also be affected.'))return;try{await api('/'+type+'/'+id,{method:'DELETE'});msg('Record deleted');await refresh()}catch(e){msg(e.message,true)}}
async function changeStatus(id,status){try{await api('/appointments/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});msg('Appointment updated');await refresh()}catch(e){msg(e.message,true)}}
async function markPaid(id){try{await api('/bills/'+id+'/payment',{method:'PUT',body:JSON.stringify({paymentStatus:'Paid'})});msg('Payment marked as paid');await refresh()}catch(e){msg(e.message,true)}}
async function editPatient(id){let p=cache.patients.find(x=>x.id===id);if(!p)return;let name=prompt('Patient name:',p.name);if(name===null)return;let age=prompt('Age:',p.age);if(age===null)return;let diagnosis=prompt('Diagnosis:',p.diagnosis||'');if(diagnosis===null)return;try{await api('/patients/'+id,{method:'PUT',body:JSON.stringify({...p,name,age:Number(age),gender:p.gender||'',phone:p.phone||'',email:p.email||'',address:p.address||'',diagnosis})});msg('Patient updated');await refresh()}catch(e){msg(e.message,true)}}
refresh().catch(e=>msg(e.message,true));
</script></body></html>
